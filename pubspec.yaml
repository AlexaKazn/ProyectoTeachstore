name: techstore_360
description: Plataforma Inteligente de Integración Empresarial

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5

  # Navegación
  go_router: ^13.2.0

  # Inyección de dependencias
  get_it: ^7.6.7

  # HTTP
  dio: ^5.4.0

  # Almacenamiento local (JWT)
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Gráficos
  fl_chart: ^0.67.0

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Fechas y moneda
  intl: ^0.19.0
  flutter_vector_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true